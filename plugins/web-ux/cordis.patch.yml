# dsh-plugin-web-ux 的 bundle patch：把面向客户端的插件行插进 web profile 名单。
# 应用方式：作为 profile 的 bundle 层（`dsh.bundle.patch` 清单字段）叠加在 dsh-base 之上，
# 用 `dsh plugin --profile web add <本目录>` 激活。
#
# 该行以「裸包名」形态插入，且这一形态是 REQUIRED：Web 侧的 client-module scan 正是从这
# 一行读取 package.json 里的 `dsh.client` 声明，浏览器半（exports "./client"，经
# /plugins/<id>/client.js 提供）才得以在 Web GUI 中加载。浏览器半贡献输入框状态行的
# provider 徽章与侧栏已归档会话的处置入口（永久删除，或移动到归档目录）。宿主半
# （exports "."）是处置能力的实载体：挂载 Connection RPC 通道 `/web-ux`（端点
# `preview-delete` / `delete-session`），不做别的事——没有浏览器宿主就没有通道，徽章
# 照常工作。
#
# `archiveRoot` 是**可选**配置键（原生 Schemastery schema，见 src/config.ts）：接受绝对
# 路径或 `~/` 开头的路径，缺省为 `$DSH_HOME/archive/sessions`。本文件因此**不带**
# `config:` 段——零配置即可跑；要改归档根，在 profile 层按 id 覆盖本行并给出
# `config: { archiveRoot: … }` 即可。注册行本身保持裸包名，不因这个可选配置而变。
#
# 项目级 MCP（`.dsh/mcp/` 扫描 + 加载 + 按工作区工具隔离）原先搭在本包的宿主半里，
# 现已拆到独立的 dsh-plugin-project-mcp：任何 profile 不装 Web 客户端也能单独安装。
- insert:
    - id: web-ux
      name: 'dsh-plugin-web-ux'
